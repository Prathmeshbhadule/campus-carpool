services:
  mongodb:
    image: mongo:7-jammy
    container_name: mitaoe-carpool-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: mitaoe_carpool

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mitaoe-carpool-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/mitaoe_carpool
      - JWT_SECRET=mitaoe_production_jwt_secret_key_2026_campus_carpool
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5000
    depends_on:
      - mongodb

volumes:
  mongo-data:
